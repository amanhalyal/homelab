# Arcadia: direct ext4 members only. Argus is dedicated parity.
parity /mnt/argus/snapraid.parity
content /var/lib/snapraid/snapraid.content
content /mnt/atlas/.snapraid/content
content /mnt/aegir/.snapraid/content
data atlas /mnt/atlas/
data aegir /mnt/aegir/
# Content directories are private, outside application data trees.
exclude /.snapraid/
exclude /lost+found/
exclude .rsync-partial/
exclude *.part
exclude *.tmp
exclude /p1_immich/staging_tmp/
exclude /p1_immich_staging/
exclude /aegir_transfer_staging/
autosave 20
temp_limit 55
temp_sleep 5
smartctl atlas -d sat %s
smartctl aegir -d sat %s
smartctl parity -d sat %s
