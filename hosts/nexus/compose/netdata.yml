services:
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    restart: unless-stopped
    hostname: nexus
    network_mode: host
    cap_add:
      - SYS_PTRACE
      - SYS_RAWIO
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    devices:
      - /dev/nvme0n1:/dev/nvme0n1
    volumes:
      - ${NETDATA_DIR}/config:/etc/netdata
      - ${NETDATA_DIR}/lib:/var/lib/netdata
      - ${NETDATA_DIR}/cache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host/root:ro,rslave
    environment:
      - NETDATA_HOST_PREFIX=/host
    mem_limit: 256m
    cpus: 0.3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
