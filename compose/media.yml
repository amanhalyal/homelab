# Legion Compose category: media server, transcoding and photos
# Loaded by COMPOSE_FILE in this directory; run 'docker compose config -q' before deployment.

x-arcadia-media-mount: &arcadia-media-mount
  type: bind
  source: /mnt/arcadia/media
  target: /mnt/arcadia/media
  bind:
    create_host_path: false

# The Arcadia pool is bound at the same absolute path inside each container, so
# the symlinks left at the old library locations resolve unchanged.
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    runtime: nvidia
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Asia/Kolkata
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
    - ${HOMELAB_DIR}/data/jellyfin/config:/config
    - ${HOMELAB_DIR}:/data
    - *arcadia-media-mount
    ports:
    - 1900:1900/udp
    - 7359:7359/udp
    mem_limit: 1500m
    cpus: 4
    networks:
    - server-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  tdarr:
    image: haveagitgat/tdarr:latest
    container_name: tdarr
    restart: unless-stopped
    mem_limit: 2g
    runtime: nvidia
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Asia/Kolkata
    - UMASK_SET=002
    - serverIP=0.0.0.0
    - serverPort=8266
    - webUIPort=8265
    - internalNode=true
    - inContainer=true
    - nodeName=LegionNode
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
    - ${HOMELAB_DIR}/data/tdarr/server:/app/server
    - ${HOMELAB_DIR}/data/tdarr/configs:/app/configs
    - ${HOMELAB_DIR}/data/tdarr/logs:/app/logs
    - ${HOMELAB_DIR}/media:/media
    - *arcadia-media-mount
    - ${HOMELAB_DIR}/data/tdarr/transcodes:/temp
    ports:
    - 8265:8265
    networks:
    - server-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v2.3.1}
    container_name: immich-server
    depends_on:
    - immich-db
    - immich-redis
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Asia/Kolkata
    - DB_USERNAME=${DB_USERNAME}
    - DB_PASSWORD=${DB_PASSWORD}
    - DB_DATABASE_NAME=immich_db
    - DB_HOSTNAME=immich-db
    - DB_PORT=5432
    - REDIS_HOSTNAME=immich-redis
    volumes:
    - ${CONFIG_DIR}/immich:/config
    - /mnt/atlas/p1_immich:/usr/src/app/upload
    devices:
    - /dev/dri:/dev/dri
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    networks:
    - server-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v2.3.1}-cuda
    container_name: immich-machine-learning
    depends_on:
    - immich-server
    runtime: nvidia
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Asia/Kolkata
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
    - model-cache:/cache
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    networks:
    - server-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  immich-redis:
    image: redis:7-alpine
    container_name: immich-redis
    restart: unless-stopped
    mem_limit: 256m
    networks:
    - server-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  immich-db:
    image: pgvector/pgvector:pg16
    container_name: immich-db
    restart: always
    environment:
    - POSTGRES_PASSWORD=${DB_PASSWORD}
    - POSTGRES_USER=${DB_USERNAME}
    - POSTGRES_DB=immich_db
    volumes:
    - ${CONFIG_DIR}/immich-database:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 1
    networks:
    - server-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'