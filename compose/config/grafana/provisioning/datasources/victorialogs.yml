apiVersion: 1
datasources:
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    # The native plugin maps Grafana queries to VictoriaLogs LogsQL APIs.
    url: http://victorialogs:9428
    basicAuth: true
    basicAuthUser: ${VICTORIALOGS_AUTH_USERNAME}
    secureJsonData:
      basicAuthPassword: ${VICTORIALOGS_AUTH_PASSWORD}
    isDefault: false
    editable: false
