# Legion Compose category: reverse proxy and DNS
# Loaded by COMPOSE_FILE in this directory; run 'docker compose config -q' before deployment.

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    mem_limit: 512m
    ports:
    - 80:80
    - 443:443
    - 81:81
    volumes:
    - ${HOMELAB_DIR}/data/nginx:/data
    - ${HOMELAB_DIR}/data/nginx/letsencrypt:/etc/letsencrypt
    networks:
      server-net:
        ipv4_address: 172.18.0.21
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    mem_limit: 256m
    ports:
    - 53:53/tcp
    - 53:53/udp
    - 8053:80/tcp
    environment:
      TZ: Asia/Kolkata
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: ALL
    volumes:
    - ${HOMELAB_DIR}/data/pihole/etc-pihole:/etc/pihole
    cap_add:
    - NET_ADMIN
    - SYS_TIME
    - SYS_NICE
    networks:
    - server-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
