# Sandbox shared by the oneshot event services. Each unit links this file as
# <unit>.service.d/10-sandbox.conf, so the hardening is written once. A unit
# adds only what is specific to it (ProtectHome, RestrictAddressFamilies,
# ReadWritePaths) in its own file. install.sh resolves the links when it
# installs the units.
[Service]
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectKernelTunables=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
UMask=0077
